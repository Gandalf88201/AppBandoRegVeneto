name: Aggiorna bandi Veneto

on:
  schedule:
    - cron: "0 5 * * *"        # GIORNALIERO: ogni giorno alle 05:00 UTC (06:00-07:00 in Italia)
    # - cron: "0 5 * * 1"      # SETTIMANALE: ogni lunedì (se lo preferisci, commenta la riga sopra e attiva questa)
  workflow_dispatch:            # avvio manuale dal tab "Actions"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Ogni esecuzione completa fino a 150 schede di dettaglio dei bandi chiusi più datati.
      - run: python aggiorna_bandi.py --max-details 150 --time-budget 1500
      - name: Salva i risultati
        run: |
          git config user.name  "bandi-bot"
          git config user.email "bandi-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Aggiornamento dati $(date -u +%F)"
          git push
